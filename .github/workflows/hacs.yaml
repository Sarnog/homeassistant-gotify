name: HACS

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Geen `ignore:` hier. Voor opname in de standaard HACS-store moet
          # deze actie slagen zonder genegeerde checks, en de brands-check
          # slaagt sinds het logo in custom_components/gotify/brand/ staat.
